name: 'doppio_analytics'
version: '1.0.0'
config-version: 2

profile: 'doppio_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  doppio_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table

vars:
  retention_days: 90