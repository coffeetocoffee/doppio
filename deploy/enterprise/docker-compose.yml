version: "3.8"
services:
  control-plane:
    image: doppio/control-plane:latest
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      DOPPIO_DB: postgres
      DOPPIO_POSTGRES: "host=postgres user=doppio password=doppio dbname=doppio"
      DOPPIO_VALKEY: valkey
    depends_on: [postgres, valkey]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: doppio
      POSTGRES_PASSWORD: doppio
      POSTGRES_DB: doppio
  valkey:
    image: valkey/valkey:latest
  clickhouse:
    image: clickhouse/clickhouse-server:latest