<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2937">
  <title>Doppio Reference PWA</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    body {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 1rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .badge-online { background: #15803d; color: #dcfce7; }
    .badge-offline { background: #b91c1c; color: #fee2e2; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 1.25rem;
      margin-top: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .flag-card {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 0.375rem;
      padding: 1rem;
    }
    .flag-name {
      font-weight: 600;
      font-size: 1rem;
      color: #93c5fd;
    }
    .flag-state {
      margin-top: 0.5rem;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .flag-state.enabled { color: #4ade80; }
    .flag-state.disabled { color: #f87171; }
    .flag-meta {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.5rem;
    }
    select, input, button {
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
    }
    button {
      cursor: pointer;
      background: #2563eb;
      border-color: #3b82f6;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    pre {
      background: #090d16;
      padding: 0.75rem;
      border-radius: 0.375rem;
      overflow-x: auto;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1 style="margin: 0;">Doppio PWA</h1>
      <small style="color: #94a3b8;">Double-shot A/B comparisons - Offline & Edge Demo</small>
    </div>
    <div>
      <span id="net-status" class="badge badge-online">ONLINE</span>
    </div>
  </div>

  <div class="card">
    <h3>Evaluation Context</h3>
    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
      <label>
        User ID:
        <input id="ctx-user" type="text" value="user_123">
      </label>
      <label>
        Country:
        <select id="ctx-country">
          <option value="US" selected>United States (US)</option>
          <option value="ID">Indonesia (ID)</option>
          <option value="DE">Germany (DE)</option>
        </select>
      </label>
      <label>
        Plan:
        <select id="ctx-plan">
          <option value="free">Free</option>
          <option value="pro">Pro</option>
          <option value="enterprise" selected>Enterprise</option>
        </select>
      </label>
      <button id="btn-re-eval" style="margin-top: 1rem;">Re-evaluate</button>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0;">Evaluated Flags</h3>
      <button id="btn-toggle-rollout">Simulate Flag Change</button>
    </div>
    <div class="grid" id="flags-grid">
      <!-- Flags rendered here -->
    </div>
  </div>

  <div class="card">
    <h3>Exposure Log (<span id="exposure-count">0</span> queued)</h3>
    <pre id="exposure-log">No exposures recorded yet.</pre>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
